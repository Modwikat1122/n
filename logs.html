<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Logs — NAWAH Verify Admin</title>
<link rel="icon" href="../images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="admin-topbar"></header>
    <main class="admin-content">
      <div class="panel">
        <div class="panel-title">
          <h3 data-i18n="logs_title"></h3>
        </div>
        <p style="color:var(--nawah-text-muted);margin-top:-8px;" data-i18n="logs_subtitle"></p>
        <div class="table-toolbar" style="margin-top:16px;">
          <input type="text" id="log-search-input" class="input-field search-input" data-i18n-placeholder="quick_search_placeholder" placeholder="Search table...">
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th data-i18n="col_cert_number"></th>
                <th data-i18n="col_date"></th>
                <th data-i18n="col_browser"></th>
                <th data-i18n="col_device"></th>
                <th data-i18n="col_country"></th>
                <th data-i18n="col_result"></th>
              </tr>
            </thead>
            <tbody id="logs-table-body">
              <tr><td colspan="6" class="text-center" data-i18n="loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/i18n.js"></script>
<script src="../js/common.js"></script>
<script src="../js/logs-admin.js"></script>
</body>
</html>
